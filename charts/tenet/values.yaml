## config pvc
config:
  name: "config"
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  storageClass: "local-path"
  accessMode: ReadWriteMany
  size: 1Gi
  annotations: {}
  additionalLabels: {}

## data pvc
data:
  name: "data"
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  storageClass: "longhorn"
  accessMode: ReadWriteMany
  size: 1Gi
  annotations: {}
  additionalLabels: {}

## rclone pvc
rclone:
  name: "media-pvc"
  size: "100Ti"
  accessMode: "ReadWriteMany"
  cacheSize: "50G"
  bufferSize: "64M"
  # Mount flags passed to CSI rclone. Replace this list to customize defaults.
  mountOptions:
    - allow_other=true
    - uid=568
    - gid=568
    - vfs-read-ahead=128M
    - path-fuse-binary=/usr/bin/fusermount3
    - dir-cache-time=30s
    - poll-interval=0
    - attr-timeout=1s
    - tpslimit=2
    - tpslimit-burst=4
  # Extra mount flags, appended without replacing the defaults above.
  extraMountOptions: []
  cacheMode: "full"
  remote: "torbox"
  remotePath: "/"

## appwatcher pvc
appwatcher:
  name: "app-watcher"
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
