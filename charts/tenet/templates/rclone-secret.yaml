{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.rclone.name }}-secret"
  namespace: {{ .Release.Namespace }}
stringData:
  configData: |
    [torbox]
    type = webdav
    # Dynamically builds: http://tenet-rehydrator-gateway.tenet-%name%.svc.cluster.local:8080/webdav/
    url = http://{{ include "tenet.fullname" . }}-rehydrator-gateway.{{ .Release.Namespace }}.svc.cluster.local:8080/webdav/
    vendor = other
    user = {{ .Values.rclone.webdav.username }}
    pass = {{ .Values.rclone.webdav.passwordObscured }}
{{- end }}